name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build

      - name: Install package (builds the C++ extension)
        run: pip install .

      - name: Install dev dependencies
        run: pip install pytest mypy

      - name: Download spaCy model
        run: python -m spacy download pt_core_news_sm

      - name: Run tests
        run: python -m pytest portunlp/tests -q

      - name: Type-check
        run: python -m mypy portunlp

  lint:
    name: Pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
