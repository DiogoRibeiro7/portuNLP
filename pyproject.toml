[project]
name = "portunlp"
version = "1.1.0"
description = "Portuguese NLP helpers built on spaCy"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{ name = "Diogo Ribeiro", email = "diogo.debastos.ribeiro@gmail.com" }]
license = { text = "MIT" }
dependencies = ["spacy>=3.7,<4.0"]

[project.scripts]
portunlp = "portunlp.cli:main"

[tool.poetry]
name = "portunlp"
version = "1.1.0"
description = "Portuguese NLP helpers built on spaCy"
authors = ["Diogo Ribeiro <diogo.debastos.ribeiro@gmail.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/DiogoRibeiro7/portuNLP"
packages = [{ include = "portunlp" }]
exclude = ["portunlp/tests/*"]

[tool.poetry.scripts]
portunlp = "portunlp.cli:main"

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
spacy = ">=3.7,<4.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
mypy = "^1.16.0"
pybind11 = "^2.13.6"
scikit-build-core = "^0.12.2"

[tool.pytest.ini_options]
testpaths = ["portunlp/tests"]

[build-system]
requires = ["poetry-core>=1.1.0", "scikit-build-core>=0.11.0", "pybind11>=2.12.0"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"
wheel.packages = ["portunlp"]

[tool.mypy]
python_version = "3.12"

[[tool.mypy.overrides]]
module = "spacy.*"
ignore_missing_imports = true
